model = "gpt-6-astra"
model_reasoning_effort = "xhigh"
review_model = "gpt-5.6-sol"
model_context_window = 872_000
model_auto_compact_token_limit = 700_000
approval_policy = "never"
sandbox_mode = "danger-full-access"
allow_login_shell = true
web_search = "live"
check_for_update_on_startup = false
developer_instructions = """
Hackathon operating law (Saint Tibo): laziest working solution per the \
YAGNI ladder; no review round, no test suite — done means verified live \
on the server. Lanes: feat/<issue>-<slug> -> <user> -> dev -> main; \
workers push only their own lane. `hack:` comment on every deliberately \
cut corner. GitHub issues are the source of truth."""
compact_prompt = """
You are performing a CONTEXT CHECKPOINT COMPACTION. Create a handoff
summary for another LLM that will resume the task.

Include:
- Current progress and key decisions made
- Important context, constraints, or user preferences
- What remains to be done (clear next steps)
- Any critical data, examples, or references needed to continue

Additionally, always preserve verbatim:
- Active issue numbers and titles (from `gh` and thread briefs)
- Current git branch, worktree path, and personal lane name
- Which issues are done (merged to the lane, `done: <sha>` commented)
- The lane law: feat/<issue> -> <user> -> dev -> main; workers never
  push dev or main
- Outstanding `hack:` markers introduced this session

Be concise, structured, and focused on helping the next LLM seamlessly
continue the work."""

[agents]
enabled = false

[plugins."saint-tibo@saint-tibo"]
enabled = true

[plugins."hack-agent-standards@saint-tibo"]
enabled = true

[plugins."hack-agent-workflow@saint-tibo"]
enabled = true

[plugins."hack-agent-lsp@saint-tibo"]
enabled = true

[plugins."hack-agent-mcp@saint-tibo"]
enabled = true

[mcp_servers.serena]
command = "uvx"
args = ["--from", "serena-agent==1.7.0", "serena", "start-mcp-server", "--context", "codex", "--open-web-dashboard", "false"]
startup_timeout_sec = 30

[mcp_servers.shadcn]
command = "bunx"
args = ["shadcn@4.21.0", "mcp"]
startup_timeout_sec = 20

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"

[mcp_servers.grep]
url = "https://mcp.grep.app"

[mcp_servers.deepwiki]
url = "https://mcp.deepwiki.com/mcp"

[mcp_servers.keenable]
url = "https://api.keenable.ai/mcp"
env_http_headers = { "X-API-Key" = "KEENABLE_API_KEY" }

[features]
multi_agent = false
multi_agent_v2 = false
hooks = true
memories = false
