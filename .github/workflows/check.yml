name: check

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Codex project artifacts
        run: python3 scripts/check_codex_setup.py
      - name: Install pinned uv
        run: |
          url="$(python3 -c 'import json; print(json.load(open("build/stack-pin.json"))["runtimes"]["uv"]["installer"]["url"])')"
          sha="$(python3 -c 'import json; print(json.load(open("build/stack-pin.json"))["runtimes"]["uv"]["installer"]["sha256"])')"
          curl -fsSL "$url" -o uv-installer.sh
          echo "$sha  uv-installer.sh" | sha256sum -c -
          UV_INSTALL_DIR="$HOME/.local/bin" UV_NO_MODIFY_PATH=1 sh uv-installer.sh
      - name: Unit tests
        run: "$HOME/.local/bin/uvx" --from pytest pytest -q
      - name: Shell syntax
        run: |
          sh -n setup install/bootstrap.sh install/env.sh
          for f in install/lib/*.sh install/modules/*/module.sh; do sh -n "$f"; done

  setup-e2e:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Full install
        run: |
          export PATH="$PWD/.local/bin:$HOME/.local/bin:$PATH"
          ./setup
      - name: Verify installed toolchain and plugins
        run: |
          export PATH="$PWD/.local/bin:$HOME/.local/bin:$PATH"
          codex --version
          codex plugin list
          python3 scripts/check_codex_setup.py
          python3 scripts/check_stack.py
