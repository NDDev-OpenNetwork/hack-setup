# Snapshot of install/modules/<nn>-*. Bootstrap globs those directories.
# Skip a module with a `disabled` file. check_codex_setup.py requires this
# list to match the numbered dirs exactly. `enabled` is documentary.

schema_version = 1
entry = "./setup"
entry_windows = "./setup.ps1"

[[modules]]
id = "prereqs"
dir = "modules/10-prereqs"
enabled = true

[[modules]]
id = "codex-cli"
dir = "modules/20-codex-cli"
enabled = true

[[modules]]
id = "runtimes"
dir = "modules/30-runtimes"
enabled = true

[[modules]]
id = "project-verify"
dir = "modules/40-project-verify"
enabled = true
